name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libfreetype6-dev libharfbuzz-dev liblua5.4-dev libfontconfig1-dev \
            libssl-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev extra-cmake-modules \
            wayland-protocols
      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja freetype harfbuzz lua pkg-config fontconfig
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -B build -G Ninja -DTRAASH_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          TRAASH_LUA_PATH: ${{ github.workspace }}/lua
