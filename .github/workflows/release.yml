name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            slug: linux-x86_64
          - os: macos-latest
            slug: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf pkg-config \
            libfreetype6-dev libharfbuzz-dev liblua5.4-dev libfontconfig1-dev libssl-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev extra-cmake-modules \
            wayland-protocols

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja freetype harfbuzz lua pkg-config fontconfig
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTRAASH_BUILD_TESTS=ON \
            -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/traash-prefix"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          TRAASH_LUA_PATH: ${{ github.workspace }}/lua

      - name: Install
        run: cmake --install build

      - name: Bundle shared libraries
        run: python3 tools/bundle_release.py --prefix "${{ runner.temp }}/traash-prefix"

      - name: Package
        run: |
          VER="${GITHUB_REF_NAME#v}"
          NAME="traash-${VER}-${{ matrix.slug }}"
          STAGING="${{ runner.temp }}/pkg"
          mkdir -p "$STAGING"
          mv "${{ runner.temp }}/traash-prefix" "$STAGING/$NAME"
          cp README.md LICENSE "$STAGING/$NAME/"
          tar -C "$STAGING" -czf "$NAME.tar.gz" "$NAME"
          ls -lh "$NAME.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}
          path: traash-*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
